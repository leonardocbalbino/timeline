{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block header %}{% endblock %}
{% block main %}
<main class="auth">
  <form method="post" class="auth-card">
    <a class="logo" href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='img/logo-mark.svg') }}" alt=""><span>íntegra</span></a>
    <div>
      <h1>Entrar</h1>
      <p class="subtle" style="margin-top:4px">Acesse os processos e provas da sua conta.</p>
    </div>
    {% include "_flashes.html" %}
    <label>E-mail <input type="text" inputmode="email" name="email" autofocus required autocomplete="username" autocapitalize="off" spellcheck="false"></label>
    <label>Senha <span class="password"><input type="password" name="senha" required autocomplete="current-password"></span></label>
    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    <p class="auth-links">{% if signup_open %}<a href="{{ url_for('signup') }}">Crie grátis</a> · {% endif %}<a href="{{ url_for('index') }}">Conheça o sistema</a></p>
  </form>
</main>
{% endblock %}
