{% macro media(f, report=False) -%}
<figure class="midia midia-{{ f.kind }}">
  {% if f.kind == 'imagem' %}
    <img src="{{ url_for('file', fid=f.id) }}" alt="{{ f.original_name }}" loading="lazy" class="zoom">
  {% elif f.kind == 'audio' and not report %}
    <audio controls preload="metadata" src="{{ url_for('file', fid=f.id) }}"></audio>
  {% elif f.kind == 'video' and not report %}
    <video controls preload="metadata" playsinline src="{{ url_for('file', fid=f.id) }}"></video>
  {% elif not report %}
    <a class="doc" href="{{ url_for('file', fid=f.id) }}" target="_blank">📄 Abrir documento</a>
  {% endif %}
  <figcaption>
    <span class="tipo">{{ f.kind }}</span>
    <a href="{{ url_for('file', fid=f.id, baixar=1) }}" title="Baixar original">{{ f.original_name }}</a>
    · {{ f.size|human_size }}
    <code class="hash" title="SHA-256 calculado no envio">SHA-256: {{ f.sha256 }}</code>
  </figcaption>
</figure>
{%- endmacro %}
