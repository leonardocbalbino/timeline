{% extends "base.html" %}
{% block title %}Minha conta{% endblock %}
{% block content %}
<div class="page-narrow" style="max-width:480px">
<form method="post" class="card card-lg stack-lg">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div>
    <h1>Minha conta</h1>
    <p class="subtle" style="margin-top:6px">{{ g.user.email }}</p>
  </div>
  <label>Senha atual <span class="password"><input type="password" name="atual" required autocomplete="current-password"></span></label>
  <label>Nova senha <span class="hint">mínimo de 8 caracteres</span>
    <span class="password"><input type="password" name="nova" required minlength="8" autocomplete="new-password"></span></label>
  <label>Confirmar nova senha <span class="password"><input type="password" name="confirma" required minlength="8" autocomplete="new-password"></span></label>
  <div class="form-actions"><button class="btn btn-primary">Alterar senha</button><a class="btn btn-ghost" href="{{ url_for('index') }}">Cancelar</a></div>
</form>
</div>
{% endblock %}
