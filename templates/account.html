{% extends "base.html" %}
{% block title %}Minha conta{% endblock %}
{% block content %}
<form method="post" class="cartao formulario estreito" style="max-width:480px">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div>
    <h1>Minha conta</h1>
    <p class="sutil" style="margin:4px 0 0">{{ g.user.email }}</p>
  </div>
  <label>Senha atual <input type="password" name="atual" required autocomplete="current-password"></label>
  <label>Nova senha <input type="password" name="nova" required minlength="8" autocomplete="new-password"></label>
  <label>Confirmar nova senha <input type="password" name="confirma" required minlength="8" autocomplete="new-password"></label>
  <div class="acoes"><button class="botao">Alterar senha</button><a href="{{ url_for('index') }}">Cancelar</a></div>
</form>
{% endblock %}
