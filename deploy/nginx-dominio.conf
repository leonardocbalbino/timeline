# Íntegra pelo domínio, atrás do Cloudflare.
# A porta 80 atende o Cloudflare no modo SSL "Flexible" e os desafios do Let's Encrypt.
# O HTTPS na origem (modo "Full (strict)") fica em nginx-dominio-ssl.conf, ativado quando o certificado existir.

# No modo Flexible o Cloudflare fala com a origem em HTTP, mas o visitante está em HTTPS:
# o app precisa saber disso para gerar links https:// (compartilhamento, webhook do Asaas).
map $http_x_forwarded_proto $integra_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    listen [::]:80;
    server_name processointegra.com.br www.processointegra.com.br processointegra.com www.processointegra.com;

    include /etc/nginx/snippets/integra-cloudflare.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    include /etc/nginx/snippets/integra-app.conf;
}
