# HTTPS na origem para o Cloudflare no modo "Full (strict)". O install.sh só ativa este arquivo
# quando o certificado do Let's Encrypt existe (gerado por deploy/certificado.sh).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name processointegra.com.br www.processointegra.com.br;

    ssl_certificate     /etc/letsencrypt/live/processointegra.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/processointegra.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:integra_ssl:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/integra-cloudflare.conf;
    include /etc/nginx/snippets/integra-app.conf;
}
